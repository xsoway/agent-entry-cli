name: Bug report
description: Report a reproducible problem without secrets.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include OS, Python/package versions, commands and expected versus observed behavior. Remove credentials and private conversation/tool data.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe execution metadata
      description: Include the status/reason and cleanup or usage fields if relevant. Do not attach private summaries by default.
