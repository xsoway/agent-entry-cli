[project]
name = "agent-entry-cli"
version = "0.1.0"
description = "A small, project-aware terminal entry point for your main agent."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Alan Hsu"}]
keywords = ["agent", "cli", "terminal", "llm"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Programming Language :: Python :: 3.13", "Operating System :: MacOS :: MacOS X", "Operating System :: POSIX :: Linux"]
dependencies = ["openai-agents>=0.22.3,<0.23", "prompt-toolkit>=3.0.52,<4", "rich>=14,<16"]

[project.urls]
Homepage = "https://xsoway.github.io/agent-entry-cli/"
Repository = "https://github.com/xsoway/agent-entry-cli"
Issues = "https://github.com/xsoway/agent-entry-cli/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pyright>=1.1.400,<2"]

[project.scripts]
agent-entry = "agent_entry_cli.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_entry_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["UP009"]

[tool.pyright]
include = ["src/agent_entry_cli"]
venvPath = "."
venv = ".venv"
